[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tlrl-provenance"
version = "0.3.0"
description = "Proof-producing finite-trace temporal-logic audits for learned controllers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lorenzo Bacchiani" }]
keywords = ["temporal logic", "LTLf", "reinforcement learning", "provenance", "auditing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The semantic kernel (tlrl_provenance) only needs scipy.
dependencies = ["scipy>=1.13"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Deep-RL benchmark stack (audit rollouts, DQN training). Exact validated pins
# live in environment/requirements-benchmarks.txt; install that file for
# bit-for-bit reproducibility. Requires Python 3.10.
benchmarks = [
    "numpy==1.23.5",
    "torch==2.2.2",
    "gymnasium==0.28.1",
    "gymnasium-robotics==1.2.2",
    "mujoco==2.3.3",
    "pandas==2.2.1",
    "matplotlib==3.8.3",
    "seaborn==0.13.2",
    "simple_parsing==0.1.5",
    "sympy==1.12",
    "tqdm==4.66.2",
    "joblib==1.3.2",
    "colorama==0.4.6",
    "wandb==0.17.7",
]

[project.urls]
Repository = "https://github.com/LBacchiani/tlrl-provenance"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tlrl_provenance = ["py.typed"]
tlrl_benchmarks = [
    "deepltl_point/tasks.txt",
    "deepltl_point/manifest.json",
    "deepltl_point/manifest.json.sha256",
    "letter_env/tasks.txt",
    "letter_env/corpus_manifest.json",
    "letter_env/corpus_manifest.json.sha256",
    "flatworld/tasks.txt",
    "flatworld/corpus_manifest.json",
    "flatworld/corpus_manifest.json.sha256",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --strict-config"
